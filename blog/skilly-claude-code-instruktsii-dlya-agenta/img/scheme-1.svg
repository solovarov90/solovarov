<svg width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-label="Схема: CLAUDE.md агент читает в каждой сессии, а из трёх навыков загружает целиком только тот, что подходит под задачу «напиши статью»">
  <title>CLAUDE.md читается всегда, из навыков загружается только подходящий</title>
  <defs>
    <marker id="arrAccent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/>
    </marker>
    <marker id="arrLine" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--line)"/>
    </marker>
  </defs>

  <!-- CLAUDE.md -->
  <rect x="40" y="60" width="380" height="400" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="2"/>
  <text x="70" y="115" font-family="var(--font-display)" font-weight="600" font-size="28" fill="var(--fg)">CLAUDE.md</text>
  <text x="70" y="160" font-family="var(--font-body)" font-size="19" fill="var(--muted)">Что за проект</text>
  <text x="70" y="195" font-family="var(--font-body)" font-size="19" fill="var(--muted)">Где базы Notion</text>
  <text x="70" y="230" font-family="var(--font-body)" font-size="19" fill="var(--muted)">Чего нельзя</text>
  <line x1="70" y1="270" x2="390" y2="270" stroke="var(--line)" stroke-width="2"/>
  <text x="70" y="315" font-family="var(--font-body)" font-size="19" fill="var(--fg)">Читается в начале</text>
  <text x="70" y="345" font-family="var(--font-body)" font-size="19" fill="var(--fg)">каждой сессии, весь текст</text>
  <text x="70" y="420" font-family="var(--font-display)" font-weight="600" font-size="24" fill="var(--accent)">читается всегда</text>

  <!-- Задача -->
  <rect x="470" y="60" width="240" height="90" rx="10" fill="var(--surface)" stroke="var(--accent)" stroke-width="2"/>
  <text x="590" y="98" text-anchor="middle" font-family="var(--font-body)" font-size="17" fill="var(--muted)">Задача</text>
  <text x="590" y="130" text-anchor="middle" font-family="var(--font-display)" font-weight="600" font-size="22" fill="var(--fg)">«напиши статью»</text>

  <!-- Стрелка к главной карточке -->
  <path d="M590 150 L590 190 L760 190 L760 215" fill="none" stroke="var(--accent)" stroke-width="4" marker-end="url(#arrAccent)"/>

  <!-- Навык: статья (подсвечен) -->
  <rect x="760" y="220" width="400" height="110" rx="10" fill="var(--surface)" stroke="var(--accent)" stroke-width="4"/>
  <text x="790" y="265" font-family="var(--font-display)" font-weight="600" font-size="26" fill="var(--accent)">Навык «статья»</text>
  <text x="790" y="300" font-family="var(--font-body)" font-size="19" fill="var(--fg)">Загружен целиком: шаги, тон, проверки</text>

  <!-- Навык: монтаж -->
  <rect x="760" y="355" width="400" height="90" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="2"/>
  <text x="790" y="397" font-family="var(--font-display)" font-weight="600" font-size="24" fill="var(--muted)">Навык «монтаж»</text>
  <text x="790" y="428" font-family="var(--font-body)" font-size="17" fill="var(--muted)">только описание</text>

  <!-- Навык: разбор ролика -->
  <rect x="760" y="470" width="400" height="90" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="2"/>
  <text x="790" y="512" font-family="var(--font-display)" font-weight="600" font-size="24" fill="var(--muted)">Навык «разбор ролика»</text>
  <text x="790" y="543" font-family="var(--font-body)" font-size="17" fill="var(--muted)">только описание</text>

  <!-- Связь CLAUDE.md с навыками -->
  <path d="M420 260 L470 260" fill="none" stroke="var(--line)" stroke-width="2" marker-end="url(#arrLine)"/>

  <!-- Подпись -->
  <text x="590" y="250" text-anchor="middle" font-family="var(--font-body)" font-size="17" fill="var(--muted)"> </text>
</svg>