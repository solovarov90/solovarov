<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="100%" role="img" aria-label="Путь голосового сообщения от Telegram до карточки задачи в Notion: пять шагов, каждый делает своя программа">
<title>Путь голосового от Telegram до карточки задачи в Notion</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 z" fill="var(--line)"/>
</marker>
<marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/>
</marker>
</defs>

<!-- Ряд 1: три узла -->
<rect x="40" y="40" width="300" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="2"/>
<circle cx="82" cy="82" r="22" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
<text x="82" y="90" text-anchor="middle" font-family="var(--font-display)" font-weight="600" font-size="24" fill="var(--accent)">1</text>
<text x="120" y="90" font-family="var(--font-display)" font-weight="600" font-size="26" fill="var(--fg)">Telegram</text>
<text x="64" y="138" font-family="var(--font-body)" font-size="19" fill="var(--muted)">Ты наговариваешь</text>
<text x="64" y="166" font-family="var(--font-body)" font-size="19" fill="var(--muted)">голосовое или кружок</text>

<rect x="450" y="40" width="300" height="170" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="2"/>
<circle cx="492" cy="82" r="22" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
<text x="492" y="90" text-anchor="middle" font-family="var(--font-display)" font-weight="600" font-size="24" fill="var(--accent)">2</text>
<text x="530" y="90" font-family="var(--font-display)" font-weight="600" font-size="26" fill="var(--fg)">Бот на сервере</text>
<text x="474" y="138" font-family="var(--font-body)" font-size="19" fill="var(--muted)">Ловит сообщение</text>
<text x="474" y="166" font-family="var(--font-body)" font-size="19" fill="var(--muted)">и скачивает файл</text>

<rect x="860" y="40" width="300" height="170" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="2"/>
<circle cx="902" cy="82" r="22" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
<text x="902" y="90" text-anchor="middle" font-family="var(--font-display)" font-weight="600" font-size="24" fill="var(--accent)">3</text>
<text x="940" y="90" font-family="var(--font-display)" font-weight="600" font-size="26" fill="var(--fg)">Whisper</text>
<text x="884" y="138" font-family="var(--font-body)" font-size="19" fill="var(--muted)">Превращает звук</text>
<text x="884" y="166" font-family="var(--font-body)" font-size="19" fill="var(--muted)">в текст</text>

<!-- Стрелки ряда 1 -->
<line x1="340" y1="125" x2="446" y2="125" stroke="var(--line)" stroke-width="3" marker-end="url(#arr)"/>
<text x="395" y="108" text-anchor="middle" font-family="var(--font-body)" font-size="18" fill="var(--muted)">файл</text>
<line x1="750" y1="125" x2="856" y2="125" stroke="var(--line)" stroke-width="3" marker-end="url(#arr)"/>
<text x="803" y="108" text-anchor="middle" font-family="var(--font-body)" font-size="18" fill="var(--muted)">звук</text>

<!-- Переход вниз: текст -->
<path d="M1010 210 L1010 275 L890 275 L890 330" fill="none" stroke="var(--accent)" stroke-width="3" marker-end="url(#arrA)"/>
<text x="1030" y="262" font-family="var(--font-body)" font-size="18" fill="var(--muted)">текст</text>

<!-- Ряд 2: узлы справа налево -->
<rect x="740" y="335" width="300" height="170" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="2"/>
<circle cx="782" cy="377" r="22" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
<text x="782" y="385" text-anchor="middle" font-family="var(--font-display)" font-weight="600" font-size="24" fill="var(--accent)">4</text>
<text x="820" y="385" font-family="var(--font-display)" font-weight="600" font-size="26" fill="var(--fg)">Claude Opus</text>
<text x="764" y="428" font-family="var(--font-body)" font-size="19" fill="var(--muted)">Находит суть, срок,</text>
<text x="764" y="456" font-family="var(--font-body)" font-size="19" fill="var(--muted)">исполнителя, проект</text>

<rect x="330" y="335" width="300" height="170" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="2"/>
<circle cx="372" cy="377" r="22" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
<text x="372" y="385" text-anchor="middle" font-family="var(--font-display)" font-weight="600" font-size="24" fill="var(--accent)">5</text>
<text x="410" y="385" font-family="var(--font-display)" font-weight="600" font-size="26" fill="var(--fg)">Notion</text>
<text x="354" y="428" font-family="var(--font-body)" font-size="19" fill="var(--muted)">Новая строка задачи</text>
<text x="354" y="456" font-family="var(--font-body)" font-size="19" fill="var(--muted)">в таск-трекере</text>

<line x1="740" y1="420" x2="634" y2="420" stroke="var(--line)" stroke-width="3" marker-end="url(#arr)"/>
<text x="687" y="403" text-anchor="middle" font-family="var(--font-body)" font-size="18" fill="var(--muted)">задача</text>

<!-- Итог: ответ в чат -->
<rect x="40" y="365" width="200" height="110" rx="10" fill="var(--surface)" stroke="var(--accent)" stroke-width="2.5"/>
<text x="140" y="410" text-anchor="middle" font-family="var(--font-display)" font-weight="600" font-size="24" fill="var(--fg)">Ответ в чат</text>
<text x="140" y="445" text-anchor="middle" font-family="var(--font-body)" font-size="19" fill="var(--muted)">со ссылкой</text>

<line x1="330" y1="420" x2="244" y2="420" stroke="var(--accent)" stroke-width="3.5" marker-end="url(#arrA)"/>
<text x="287" y="403" text-anchor="middle" font-family="var(--font-body)" font-size="18" fill="var(--muted)">ссылка</text>
</svg>