<svg width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-label="Конвейер ИИ-сотрудников: заявка, запись в таблицу или CRM, агент-исполнитель, проверка, при замечаниях повтор к исполнителю не больше двух раз, человек нажимает «Применить», результат в базе">
  <title>Последовательный конвейер ИИ-сотрудников</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--line)"/>
    </marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/>
    </marker>
  </defs>

  <!-- Ряд 1 -->
  <rect x="40" y="60" width="300" height="130" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="2"/>
  <text x="62" y="102" font-family="var(--font-display)" font-weight="600" font-size="24" fill="var(--accent)">1</text>
  <text x="92" y="102" font-family="var(--font-display)" font-weight="600" font-size="26" fill="var(--fg)">Заявка</text>
  <text x="62" y="142" font-family="var(--font-body)" font-size="18" fill="var(--muted)">Клиент или сотрудник</text>
  <text x="62" y="166" font-family="var(--font-body)" font-size="18" fill="var(--muted)">ставит задачу</text>

  <rect x="450" y="60" width="300" height="130" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="2"/>
  <text x="472" y="102" font-family="var(--font-display)" font-weight="600" font-size="24" fill="var(--accent)">2</text>
  <text x="502" y="102" font-family="var(--font-display)" font-weight="600" font-size="26" fill="var(--fg)">Запись</text>
  <text x="472" y="142" font-family="var(--font-body)" font-size="18" fill="var(--muted)">Строка в таблице</text>
  <text x="472" y="166" font-family="var(--font-body)" font-size="18" fill="var(--muted)">или в CRM</text>

  <rect x="860" y="60" width="300" height="130" rx="10" fill="var(--surface)" stroke="var(--accent)" stroke-width="3"/>
  <text x="882" y="102" font-family="var(--font-display)" font-weight="600" font-size="24" fill="var(--accent)">3</text>
  <text x="912" y="102" font-family="var(--font-display)" font-weight="600" font-size="26" fill="var(--fg)">Исполнитель</text>
  <text x="882" y="142" font-family="var(--font-body)" font-size="18" fill="var(--muted)">Агент делает один шаг</text>
  <text x="882" y="166" font-family="var(--font-body)" font-size="18" fill="var(--muted)">по своему регламенту</text>

  <line x1="340" y1="125" x2="446" y2="125" stroke="var(--accent)" stroke-width="3" marker-end="url(#arrA)"/>
  <line x1="750" y1="125" x2="856" y2="125" stroke="var(--accent)" stroke-width="3" marker-end="url(#arrA)"/>

  <!-- Ряд 2 -->
  <rect x="860" y="330" width="300" height="130" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="2"/>
  <text x="882" y="372" font-family="var(--font-display)" font-weight="600" font-size="24" fill="var(--accent)">4</text>
  <text x="912" y="372" font-family="var(--font-display)" font-weight="600" font-size="26" fill="var(--fg)">Проверка</text>
  <text x="882" y="412" font-family="var(--font-body)" font-size="18" fill="var(--muted)">Отдельный агент</text>
  <text x="882" y="436" font-family="var(--font-body)" font-size="18" fill="var(--muted)">или простое правило</text>

  <rect x="450" y="330" width="300" height="130" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="2"/>
  <text x="472" y="372" font-family="var(--font-display)" font-weight="600" font-size="24" fill="var(--accent)">5</text>
  <text x="502" y="372" font-family="var(--font-display)" font-weight="600" font-size="26" fill="var(--fg)">Человек</text>
  <text x="472" y="412" font-family="var(--font-body)" font-size="18" fill="var(--muted)">Смотрит результат и</text>
  <text x="472" y="436" font-family="var(--font-body)" font-size="18" fill="var(--muted)">нажимает «Применить»</text>

  <rect x="40" y="330" width="300" height="130" rx="10" fill="var(--surface)" stroke="var(--accent)" stroke-width="3"/>
  <text x="62" y="372" font-family="var(--font-display)" font-weight="600" font-size="24" fill="var(--accent)">6</text>
  <text x="92" y="372" font-family="var(--font-display)" font-weight="600" font-size="26" fill="var(--fg)">Результат</text>
  <text x="62" y="412" font-family="var(--font-body)" font-size="18" fill="var(--muted)">Готовая запись</text>
  <text x="62" y="436" font-family="var(--font-body)" font-size="18" fill="var(--muted)">лежит в базе</text>

  <!-- Исполнитель -> Проверка -->
  <line x1="1010" y1="190" x2="1010" y2="326" stroke="var(--accent)" stroke-width="3" marker-end="url(#arrA)"/>

  <!-- Возврат при замечаниях -->
  <path d="M1110 330 L1110 190" fill="none" stroke="var(--line)" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arr)"/>
  <text x="1130" y="250" font-family="var(--font-body)" font-size="17" fill="var(--muted)" text-anchor="end" transform="rotate(-90 1130 250)">повтор при замечаниях</text>
  <text x="1010" y="262" font-family="var(--font-body)" font-size="17" fill="var(--muted)" text-anchor="end" transform="translate(-14 0)">замечаний нет</text>

  <!-- Проверка -> Человек -> Результат -->
  <line x1="860" y1="395" x2="754" y2="395" stroke="var(--accent)" stroke-width="3" marker-end="url(#arrA)"/>
  <line x1="450" y1="395" x2="344" y2="395" stroke="var(--accent)" stroke-width="3" marker-end="url(#arrA)"/>

  <text x="1160" y="520" font-family="var(--font-body)" font-size="17" fill="var(--muted)" text-anchor="end">Возврат к исполнителю — не больше двух раз</text>
</svg>