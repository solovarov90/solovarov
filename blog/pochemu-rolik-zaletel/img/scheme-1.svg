<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" width="100%" role="img" aria-label="Цепочка разбора чужого ролика: ссылка в Telegram, скачивание, расшифровка Whisper, Gemini смотрит видео, карточка в Референсах, сценарий-ремейк в Контент-плане. Занимает 2–5 минут и около 1 цента.">
  <title>Цепочка разбора чужого ролика: от ссылки до сценария-ремейка</title>
  <defs>
    <marker id="ar-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9 Z" fill="var(--line)" stroke="var(--line)" stroke-linejoin="round"/>
    </marker>
    <marker id="ar-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9 Z" fill="var(--accent)" stroke="var(--accent)" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Ряд 1 -->
  <rect x="30" y="30" width="320" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="2"/>
  <circle cx="68" cy="68" r="22" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
  <text x="68" y="76" text-anchor="middle" font-family="var(--font-display)" font-weight="600" font-size="24" fill="var(--accent)">1</text>
  <text x="54" y="128" font-family="var(--font-display)" font-weight="600" font-size="25" fill="var(--fg)">Ссылка в Telegram</text>
  <text x="54" y="160" font-family="var(--font-body)" font-size="18" fill="var(--muted)">Тема «Референсы»:</text>
  <text x="54" y="184" font-family="var(--font-body)" font-size="18" fill="var(--muted)">ссылка или файл до 20 МБ</text>

  <rect x="440" y="30" width="320" height="200" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="2"/>
  <circle cx="478" cy="68" r="22" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
  <text x="478" y="76" text-anchor="middle" font-family="var(--font-display)" font-weight="600" font-size="24" fill="var(--accent)">2</text>
  <text x="464" y="128" font-family="var(--font-display)" font-weight="600" font-size="25" fill="var(--fg)">Скачивание</text>
  <text x="464" y="160" font-family="var(--font-body)" font-size="18" fill="var(--muted)">Instagram — yt-dlp, TikTok — tikwm,</text>
  <text x="464" y="184" font-family="var(--font-body)" font-size="18" fill="var(--muted)">YouTube — ссылкой в Gemini</text>

  <rect x="850" y="30" width="320" height="200" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="2"/>
  <circle cx="888" cy="68" r="22" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
  <text x="888" y="76" text-anchor="middle" font-family="var(--font-display)" font-weight="600" font-size="24" fill="var(--accent)">3</text>
  <text x="874" y="128" font-family="var(--font-display)" font-weight="600" font-size="25" fill="var(--fg)">Расшифровка</text>
  <text x="874" y="160" font-family="var(--font-body)" font-size="18" fill="var(--muted)">Whisper превращает речь</text>
  <text x="874" y="184" font-family="var(--font-body)" font-size="18" fill="var(--muted)">в текст с таймкодами</text>

  <!-- Стрелки ряда 1 и переход вниз -->
  <path d="M352 130 H436" fill="none" stroke="var(--line)" stroke-width="3" marker-end="url(#ar-line)"/>
  <path d="M762 130 H846" fill="none" stroke="var(--line)" stroke-width="3" marker-end="url(#ar-line)"/>
  <path d="M1010 232 V296" fill="none" stroke="var(--line)" stroke-width="3" marker-end="url(#ar-line)"/>

  <!-- Ряд 2 (справа налево) -->
  <rect x="850" y="300" width="320" height="200" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="2"/>
  <circle cx="888" cy="338" r="22" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
  <text x="888" y="346" text-anchor="middle" font-family="var(--font-display)" font-weight="600" font-size="24" fill="var(--accent)">4</text>
  <text x="874" y="398" font-family="var(--font-display)" font-weight="600" font-size="25" fill="var(--fg)">Gemini смотрит</text>
  <text x="874" y="430" font-family="var(--font-body)" font-size="18" fill="var(--muted)">Весь ролик целиком: хук,</text>
  <text x="874" y="454" font-family="var(--font-body)" font-size="18" fill="var(--muted)">структура, монтаж, почему залетело</text>

  <rect x="440" y="300" width="320" height="200" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="2"/>
  <circle cx="478" cy="338" r="22" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
  <text x="478" y="346" text-anchor="middle" font-family="var(--font-display)" font-weight="600" font-size="24" fill="var(--accent)">5</text>
  <text x="464" y="398" font-family="var(--font-display)" font-weight="600" font-size="25" fill="var(--fg)">Карточка</text>
  <text x="464" y="430" font-family="var(--font-body)" font-size="18" fill="var(--muted)">Сервер записывает разбор</text>
  <text x="464" y="454" font-family="var(--font-body)" font-size="18" fill="var(--muted)">в базу «Референсы»</text>

  <rect x="30" y="300" width="320" height="200" rx="10" fill="var(--surface)" stroke="var(--accent)" stroke-width="3"/>
  <circle cx="68" cy="338" r="22" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
  <text x="68" y="346" text-anchor="middle" font-family="var(--font-display)" font-weight="600" font-size="24" fill="var(--accent)">6</text>
  <text x="54" y="398" font-family="var(--font-display)" font-weight="600" font-size="25" fill="var(--fg)">Сценарий-ремейк</text>
  <text x="54" y="430" font-family="var(--font-body)" font-size="18" fill="var(--muted)">Ложится в «Контент-план»,</text>
  <text x="54" y="454" font-family="var(--font-body)" font-size="18" fill="var(--muted)">приходит в Telegram</text>

  <!-- Стрелки ряда 2 -->
  <path d="M848 400 H764" fill="none" stroke="var(--line)" stroke-width="3" marker-end="url(#ar-line)"/>
  <path d="M438 400 H354" fill="none" stroke="var(--accent)" stroke-width="3.5" marker-end="url(#ar-accent)"/>

  <!-- Итог -->
  <rect x="300" y="535" width="600" height="52" rx="10" fill="var(--surface)" stroke="var(--accent)" stroke-width="2"/>
  <text x="600" y="570" text-anchor="middle" font-family="var(--font-display)" font-weight="600" font-size="26" fill="var(--accent)">2–5 минут · около 1 цента</text>
</svg>