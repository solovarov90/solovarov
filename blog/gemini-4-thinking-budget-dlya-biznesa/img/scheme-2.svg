<svg width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-label="Схема роутинга запросов бота по уровням размышлений: быстрая проверка типа задачи, короткие задачи уходят на Flash-Lite или low, сложные на Gemini 4 на high с проверкой ответа">
  <title>Роутинг запросов: рутина идёт быстрым путём, сложное уходит на глубокий</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--line)"/>
    </marker>
    <marker id="arrAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/>
    </marker>
  </defs>

  <!-- 1. Входящий запрос -->
  <rect x="400" y="20" width="400" height="80" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="2"/>
  <circle cx="436" cy="60" r="16" fill="var(--accent)"/>
  <text x="436" y="67" text-anchor="middle" font-family="var(--font-display)" font-weight="600" font-size="20" fill="var(--surface)">1</text>
  <text x="470" y="68" font-family="var(--font-display)" font-weight="600" font-size="26" fill="var(--fg)">Входящий запрос</text>

  <!-- стрелка 1 -> 2 -->
  <line x1="600" y1="100" x2="600" y2="150" stroke="var(--accent)" stroke-width="3" marker-end="url(#arrAccent)"/>

  <!-- 2. Быстрая проверка -->
  <rect x="340" y="152" width="520" height="104" rx="10" fill="var(--surface)" stroke="var(--accent)" stroke-width="2"/>
  <circle cx="376" cy="204" r="16" fill="var(--accent)"/>
  <text x="376" y="211" text-anchor="middle" font-family="var(--font-display)" font-weight="600" font-size="20" fill="var(--surface)">2</text>
  <text x="408" y="198" font-family="var(--font-display)" font-weight="600" font-size="26" fill="var(--fg)">Быстрая проверка</text>
  <text x="408" y="230" font-family="var(--font-body)" font-size="19" fill="var(--muted)">Какого типа задача?</text>

  <!-- стрелки к ветвям -->
  <path d="M520 256 L520 290 L270 290 L270 324" fill="none" stroke="var(--line)" stroke-width="3" marker-end="url(#arr)"/>
  <path d="M680 256 L680 290 L930 290 L930 324" fill="none" stroke="var(--line)" stroke-width="3" marker-end="url(#arr)"/>
  <text x="400" y="282" text-anchor="middle" font-family="var(--font-body)" font-size="18" fill="var(--muted)">короткая</text>
  <text x="800" y="282" text-anchor="middle" font-family="var(--font-body)" font-size="18" fill="var(--muted)">сложная</text>

  <!-- 3. Короткая задача -->
  <rect x="40" y="326" width="460" height="130" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="2"/>
  <circle cx="76" cy="358" r="16" fill="var(--accent)"/>
  <text x="76" y="365" text-anchor="middle" font-family="var(--font-display)" font-weight="600" font-size="20" fill="var(--surface)">3</text>
  <text x="104" y="366" font-family="var(--font-display)" font-weight="600" font-size="24" fill="var(--fg)">Короткая задача</text>
  <text x="68" y="404" font-family="var(--font-body)" font-size="18" fill="var(--muted)">Ответ клиенту, сортировка заявок,</text>
  <text x="68" y="430" font-family="var(--font-body)" font-size="18" fill="var(--muted)">сводка переписки</text>

  <!-- 3. Сложная задача -->
  <rect x="700" y="326" width="460" height="130" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="2"/>
  <circle cx="736" cy="358" r="16" fill="var(--accent)"/>
  <text x="736" y="365" text-anchor="middle" font-family="var(--font-display)" font-weight="600" font-size="20" fill="var(--surface)">3</text>
  <text x="764" y="366" font-family="var(--font-display)" font-weight="600" font-size="24" fill="var(--fg)">Сложная задача</text>
  <text x="728" y="404" font-family="var(--font-body)" font-size="18" fill="var(--muted)">Аудит, разбор договора,</text>
  <text x="728" y="430" font-family="var(--font-body)" font-size="18" fill="var(--muted)">многошаговый расчёт</text>

  <!-- вниз к моделям -->
  <line x1="270" y1="456" x2="270" y2="496" stroke="var(--line)" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="930" y1="456" x2="930" y2="496" stroke="var(--line)" stroke-width="3" marker-end="url(#arr)"/>

  <!-- 4. Flash-Lite / low -->
  <rect x="40" y="498" width="460" height="100" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="2"/>
  <circle cx="76" cy="534" r="16" fill="var(--accent)"/>
  <text x="76" y="541" text-anchor="middle" font-family="var(--font-display)" font-weight="600" font-size="20" fill="var(--surface)">4</text>
  <text x="104" y="541" font-family="var(--font-display)" font-weight="600" font-size="24" fill="var(--fg)">Flash-Lite или low</text>
  <text x="68" y="578" font-family="var(--font-body)" font-size="18" fill="var(--muted)">Быстро и дёшево, сразу ответ</text>

  <!-- 4. Gemini 4 high -->
  <rect x="700" y="498" width="460" height="100" rx="10" fill="var(--surface)" stroke="var(--accent)" stroke-width="2"/>
  <circle cx="736" cy="534" r="16" fill="var(--accent)"/>
  <text x="736" y="541" text-anchor="middle" font-family="var(--font-display)" font-weight="600" font-size="20" fill="var(--surface)">4</text>
  <text x="764" y="541" font-family="var(--font-display)" font-weight="600" font-size="24" fill="var(--fg)">Gemini 4 на high</text>
  <text x="728" y="578" font-family="var(--font-body)" font-size="18" fill="var(--muted)">Долгое размышление, затем проверка ответа</text>
</svg>