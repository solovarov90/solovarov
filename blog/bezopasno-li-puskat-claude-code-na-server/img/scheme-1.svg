<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="100%" role="img" aria-label="Путь инъекции: скрытая фраза в чужом файле доходит до агента, и три слоя защиты не дают ей увести ключи наружу">
<title>Как скрытая инструкция в чужом файле пытается увести агента и на каких слоях она останавливается</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 z" fill="var(--line)"/>
</marker>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/>
</marker>
</defs>

<!-- Верхний ряд: путь инъекции -->
<rect x="30" y="40" width="330" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="2"/>
<circle cx="66" cy="76" r="18" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
<text x="66" y="83" text-anchor="middle" font-family="var(--font-display)" font-weight="600" font-size="22" fill="var(--accent)">1</text>
<text x="98" y="83" font-family="var(--font-display)" font-weight="600" font-size="24" fill="var(--fg)">Чужой файл</text>
<text x="56" y="118" font-family="var(--font-body)" font-size="18" fill="var(--muted)">Репозиторий или страница</text>
<text x="56" y="144" font-family="var(--font-body)" font-size="18" fill="var(--muted)">со скрытой фразой</text>

<rect x="435" y="40" width="330" height="130" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="2"/>
<circle cx="471" cy="76" r="18" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
<text x="471" y="83" text-anchor="middle" font-family="var(--font-display)" font-weight="600" font-size="22" fill="var(--accent)">2</text>
<text x="503" y="83" font-family="var(--font-display)" font-weight="600" font-size="24" fill="var(--fg)">Агент читает</text>
<text x="461" y="118" font-family="var(--font-body)" font-size="18" fill="var(--muted)">Принимает фразу</text>
<text x="461" y="144" font-family="var(--font-body)" font-size="18" fill="var(--muted)">за указание к делу</text>

<rect x="840" y="40" width="330" height="130" rx="10" fill="var(--surface)" stroke="var(--accent)" stroke-width="2.5"/>
<circle cx="876" cy="76" r="18" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
<text x="876" y="83" text-anchor="middle" font-family="var(--font-display)" font-weight="600" font-size="22" fill="var(--accent)">3</text>
<text x="908" y="83" font-family="var(--font-display)" font-weight="600" font-size="24" fill="var(--fg)">Попытка</text>
<text x="866" y="118" font-family="var(--font-body)" font-size="18" fill="var(--muted)">Прочитать .env и</text>
<text x="866" y="144" font-family="var(--font-body)" font-size="18" fill="var(--muted)">отправить наружу</text>

<line x1="360" y1="105" x2="431" y2="105" stroke="var(--accent)" stroke-width="3" marker-end="url(#arrA)"/>
<line x1="765" y1="105" x2="836" y2="105" stroke="var(--accent)" stroke-width="3" marker-end="url(#arrA)"/>

<!-- Стрелка вниз -->
<line x1="1005" y1="170" x2="1005" y2="262" stroke="var(--accent)" stroke-width="3" marker-end="url(#arrA)"/>
<text x="600" y="228" font-family="var(--font-body)" font-size="19" fill="var(--muted)">Дальше путь идёт через три слоя защиты. Каждый из них останавливает попытку сам.</text>

<!-- Нижний ряд: слои защиты -->
<rect x="30" y="270" width="360" height="250" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="2"/>
<text x="56" y="316" font-family="var(--font-display)" font-weight="600" font-size="24" fill="var(--accent)">Слой 1</text>
<text x="56" y="352" font-family="var(--font-display)" font-weight="600" font-size="24" fill="var(--fg)">Пользователь Linux</text>
<text x="56" y="396" font-family="var(--font-body)" font-size="18" fill="var(--muted)">У него нет доступа</text>
<text x="56" y="422" font-family="var(--font-body)" font-size="18" fill="var(--muted)">к чужим файлам и</text>
<text x="56" y="448" font-family="var(--font-body)" font-size="18" fill="var(--muted)">системным папкам</text>
<text x="56" y="496" font-family="var(--font-body)" font-size="18" fill="var(--fg)">Читать нечего</text>

<rect x="420" y="270" width="360" height="250" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="2"/>
<text x="446" y="316" font-family="var(--font-display)" font-weight="600" font-size="24" fill="var(--accent)">Слой 2</text>
<text x="446" y="352" font-family="var(--font-display)" font-weight="600" font-size="24" fill="var(--fg)">--allowedTools</text>
<text x="446" y="396" font-family="var(--font-body)" font-size="18" fill="var(--muted)">В списке нет сети:</text>
<text x="446" y="422" font-family="var(--font-body)" font-size="18" fill="var(--muted)">ни curl, ни wget,</text>
<text x="446" y="448" font-family="var(--font-body)" font-size="18" fill="var(--muted)">ни WebFetch</text>
<text x="446" y="496" font-family="var(--font-body)" font-size="18" fill="var(--fg)">Отправлять нечем</text>

<rect x="810" y="270" width="360" height="250" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="2"/>
<text x="836" y="316" font-family="var(--font-display)" font-weight="600" font-size="24" fill="var(--accent)">Слой 3</text>
<text x="836" y="352" font-family="var(--font-display)" font-weight="600" font-size="24" fill="var(--fg)">Ключи вне папки</text>
<text x="836" y="396" font-family="var(--font-body)" font-size="18" fill="var(--muted)">Рабочая папка пуста:</text>
<text x="836" y="422" font-family="var(--font-body)" font-size="18" fill="var(--muted)">секреты лежат в</text>
<text x="836" y="448" font-family="var(--font-body)" font-size="18" fill="var(--muted)">другом месте</text>
<text x="836" y="496" font-family="var(--font-body)" font-size="18" fill="var(--fg)">Утекать нечему</text>

<!-- Итог -->
<rect x="30" y="556" width="1140" height="56" rx="10" fill="var(--surface)" stroke="var(--accent)" stroke-width="2.5"/>
<text x="600" y="592" text-anchor="middle" font-family="var(--font-display)" font-weight="600" font-size="24" fill="var(--fg)">Попытка упёрлась в стену, ключи остались у тебя</text>
</svg>