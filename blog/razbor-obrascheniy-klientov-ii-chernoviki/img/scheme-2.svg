<svg width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-label="Схема: черновики ИИ делятся по метке на три потока: «Уверен» уходит на быструю отправку, «Сомневаюсь» на проверку человеком, запросы про деньги, договор и жалобы всегда решает человек. Отдельно дважды в неделю проверяются 3–5 случайных ответов с меткой «Уверен»."><title>Выборочная проверка ответов ИИ</title><defs><marker id="arA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--accent)"/></marker><marker id="arL" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--line)"/></marker></defs><rect x="30" y="290" width="270" height="100" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="2"/><text x="50" y="328" font-family="var(--font-display)" font-weight="600" font-size="24" fill="var(--fg)">Черновики ИИ</text><text x="50" y="356" font-family="var(--font-body)" font-size="18" fill="var(--muted)">Каждое обращение получает</text><text x="50" y="378" font-family="var(--font-body)" font-size="18" fill="var(--muted)">ответ и метку</text><rect x="370" y="290" width="250" height="100" rx="10" fill="var(--surface)" stroke="var(--accent)" stroke-width="2"/><text x="390" y="328" font-family="var(--font-display)" font-weight="600" font-size="24" fill="var(--fg)">Развилка по метке</text><text x="390" y="356" font-family="var(--font-body)" font-size="18" fill="var(--muted)">О чём запрос и насколько</text><text x="390" y="378" font-family="var(--font-body)" font-size="18" fill="var(--muted)">ИИ уверен в ответе</text><path d="M300 340H366" fill="none" stroke="var(--accent)" stroke-width="3" marker-end="url(#arA)"/><path d="M620 340H690V200H756" fill="none" stroke="var(--accent)" stroke-width="3" marker-end="url(#arA)"/><path d="M620 340H756" fill="none" stroke="var(--line)" stroke-width="3" stroke-dasharray="10 7" marker-end="url(#arL)"/><path d="M620 340H690V480H756" fill="none" stroke="var(--line)" stroke-width="6" marker-end="url(#arL)"/><rect x="760" y="150" width="410" height="100" rx="10" fill="var(--surface)" stroke="var(--accent)" stroke-width="2"/><text x="780" y="188" font-family="var(--font-display)" font-weight="600" font-size="24" fill="var(--fg)">Уверен</text><text x="780" y="216" font-family="var(--font-body)" font-size="18" fill="var(--muted)">Карточка с черновиком, пробегаешь</text><text x="780" y="238" font-family="var(--font-body)" font-size="18" fill="var(--muted)">глазами и жмёшь «Отправить»</text><rect x="760" y="290" width="410" height="100" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="2" stroke-dasharray="10 7"/><text x="780" y="328" font-family="var(--font-display)" font-weight="600" font-size="24" fill="var(--fg)">Сомневаюсь</text><text x="780" y="356" font-family="var(--font-body)" font-size="18" fill="var(--muted)">Карточка с пометкой «проверь»:</text><text x="780" y="378" font-family="var(--font-body)" font-size="18" fill="var(--muted)">читаешь, правишь, отправляешь</text><rect x="760" y="430" width="410" height="100" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="5"/><text x="780" y="468" font-family="var(--font-display)" font-weight="600" font-size="24" fill="var(--fg)">Деньги, договор, жалоба</text><text x="780" y="496" font-family="var(--font-body)" font-size="18" fill="var(--muted)">Всегда к человеку: решаешь сам,</text><text x="780" y="518" font-family="var(--font-body)" font-size="18" fill="var(--muted)">черновик ИИ служит подсказкой</text><rect x="760" y="20" width="410" height="90" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="2"/><circle cx="800" cy="62" r="14" fill="none" stroke="var(--accent)" stroke-width="4"/><path d="M810 73L824 87" stroke="var(--accent)" stroke-width="5" stroke-linecap="round"/><text x="846" y="55" font-family="var(--font-display)" font-weight="600" font-size="24" fill="var(--fg)">Выборочный контроль</text><text x="846" y="78" font-family="var(--font-body)" font-size="18" fill="var(--muted)">2 раза в неделю: 3–5 случайных</text><text x="846" y="100" font-family="var(--font-body)" font-size="18" fill="var(--muted)">ответов «Уверен»</text><path d="M965 110V146" fill="none" stroke="var(--accent)" stroke-width="3" stroke-dasharray="6 6" marker-end="url(#arA)"/></svg>