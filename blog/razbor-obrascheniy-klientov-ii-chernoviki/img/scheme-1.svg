<svg width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-label="Схема разбора обращений через ИИ: обращение клиента записывается в таблицу, ИИ ищет ответ в базе знаний и готовит черновик с меткой уверенности, менеджер в Telegram отправляет, исправляет или пропускает, и ответ уходит клиенту">
  <title>Схема разбора обращений через ИИ: заявка сохраняется до нейросети, а клиенту отвечает человек по готовому черновику</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--line)"/>
    </marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/>
    </marker>
  </defs>

  <!-- Ряд 1 -->
  <rect x="40" y="40" width="320" height="140" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="2"/>
  <circle cx="78" cy="78" r="20" fill="var(--accent)"/>
  <text x="78" y="86" text-anchor="middle" font-family="var(--font-display)" font-weight="600" font-size="22" fill="var(--surface)">1</text>
  <text x="112" y="86" font-family="var(--font-display)" font-weight="600" font-size="26" fill="var(--fg)">Приём</text>
  <text x="64" y="128" font-family="var(--font-body)" font-size="18" fill="var(--muted)">Обращение клиента:</text>
  <text x="64" y="154" font-family="var(--font-body)" font-size="18" fill="var(--muted)">Telegram, WhatsApp, почта</text>

  <rect x="440" y="40" width="320" height="140" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="2"/>
  <circle cx="478" cy="78" r="20" fill="var(--accent)"/>
  <text x="478" y="86" text-anchor="middle" font-family="var(--font-display)" font-weight="600" font-size="22" fill="var(--surface)">2</text>
  <text x="512" y="86" font-family="var(--font-display)" font-weight="600" font-size="26" fill="var(--fg)">Запись</text>
  <text x="464" y="128" font-family="var(--font-body)" font-size="18" fill="var(--muted)">Заявка в таблице или CRM.</text>
  <text x="464" y="154" font-family="var(--font-body)" font-size="18" fill="var(--muted)">Лежит, даже если ИИ упал</text>

  <rect x="840" y="40" width="320" height="140" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="2"/>
  <circle cx="878" cy="78" r="20" fill="var(--accent)"/>
  <text x="878" y="86" text-anchor="middle" font-family="var(--font-display)" font-weight="600" font-size="22" fill="var(--surface)">3</text>
  <text x="912" y="86" font-family="var(--font-display)" font-weight="600" font-size="26" fill="var(--fg)">Поиск</text>
  <text x="864" y="128" font-family="var(--font-body)" font-size="18" fill="var(--muted)">Ответ ищется в базе</text>
  <text x="864" y="154" font-family="var(--font-body)" font-size="18" fill="var(--muted)">знаний компании</text>

  <!-- Стрелки ряд 1 -->
  <line x1="360" y1="110" x2="436" y2="110" stroke="var(--line)" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="760" y1="110" x2="836" y2="110" stroke="var(--line)" stroke-width="3" marker-end="url(#arr)"/>

  <!-- Перенос вниз -->
  <path d="M1000 180 L1000 250 L600 250 L600 290" fill="none" stroke="var(--line)" stroke-width="3" marker-end="url(#arr)"/>

  <!-- Ряд 2 -->
  <rect x="440" y="290" width="320" height="170" rx="10" fill="var(--surface)" stroke="var(--accent)" stroke-width="3"/>
  <circle cx="478" cy="328" r="20" fill="var(--accent)"/>
  <text x="478" y="336" text-anchor="middle" font-family="var(--font-display)" font-weight="600" font-size="22" fill="var(--surface)">4</text>
  <text x="512" y="336" font-family="var(--font-display)" font-weight="600" font-size="26" fill="var(--fg)">Черновик</text>
  <text x="464" y="378" font-family="var(--font-body)" font-size="18" fill="var(--muted)">Ответ с меткой</text>
  <text x="464" y="404" font-family="var(--font-body)" font-size="18" fill="var(--fg)">«Уверен» или «Сомневаюсь»</text>
  <text x="464" y="436" font-family="var(--font-body)" font-size="18" fill="var(--muted)">Спорное читают внимательно</text>

  <rect x="40" y="290" width="320" height="170" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="2"/>
  <circle cx="78" cy="328" r="20" fill="var(--accent)"/>
  <text x="78" y="336" text-anchor="middle" font-family="var(--font-display)" font-weight="600" font-size="22" fill="var(--surface)">6</text>
  <text x="112" y="336" font-family="var(--font-display)" font-weight="600" font-size="26" fill="var(--fg)">Клиент</text>
  <text x="64" y="378" font-family="var(--font-body)" font-size="18" fill="var(--muted)">Получает ответ</text>
  <text x="64" y="404" font-family="var(--font-body)" font-size="18" fill="var(--muted)">от человека, а не</text>
  <text x="64" y="430" font-family="var(--font-body)" font-size="18" fill="var(--muted)">от робота</text>

  <rect x="840" y="290" width="320" height="170" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="2"/>
  <circle cx="878" cy="328" r="20" fill="var(--accent)"/>
  <text x="878" y="336" text-anchor="middle" font-family="var(--font-display)" font-weight="600" font-size="22" fill="var(--surface)">5</text>
  <text x="912" y="336" font-family="var(--font-display)" font-weight="600" font-size="26" fill="var(--fg)">Менеджер</text>
  <text x="864" y="378" font-family="var(--font-body)" font-size="18" fill="var(--muted)">Карточка в Telegram.</text>
  <text x="864" y="404" font-family="var(--font-body)" font-size="18" fill="var(--muted)">Не успел — карточка</text>
  <text x="864" y="430" font-family="var(--font-body)" font-size="18" fill="var(--muted)">ждёт и напоминает</text>

  <!-- Стрелки ряд 2: 4 -> 5 -> 6 -->
  <line x1="760" y1="375" x2="836" y2="375" stroke="var(--accent)" stroke-width="3" marker-end="url(#arrA)"/>
  <path d="M1000 460 L1000 510 L200 510 L200 464" fill="none" stroke="var(--accent)" stroke-width="3" marker-end="url(#arrA)"/>

  <!-- Кнопки -->
  <rect x="740" y="528" width="140" height="44" rx="10" fill="var(--surface)" stroke="var(--accent)" stroke-width="2"/>
  <text x="810" y="557" text-anchor="middle" font-family="var(--font-body)" font-size="18" fill="var(--fg)">Отправить</text>
  <rect x="900" y="528" width="140" height="44" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="2"/>
  <text x="970" y="557" text-anchor="middle" font-family="var(--font-body)" font-size="18" fill="var(--fg)">Исправить</text>
  <rect x="1060" y="528" width="100" height="44" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="2"/>
  <text x="1110" y="557" text-anchor="middle" font-family="var(--font-body)" font-size="18" fill="var(--fg)">Пропустить</text>
</svg>