<svg width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-label="Две дорожки: агент в Premiere помогает монтажёру правкой проекта по задаче словами, конвейер превращает дубль из Telegram в готовый ролик и выкладывает его по расписанию">
<title>Агент в программе и серверный конвейер: две дорожки</title>
<defs>
<marker id="arL" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="var(--line)" stroke="var(--line)" stroke-linejoin="round"/></marker>
<marker id="arA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="var(--accent)" stroke="var(--accent)" stroke-linejoin="round"/></marker>
</defs>

<text x="30" y="42" font-family="var(--font-display)" font-weight="600" font-size="26" fill="var(--fg)">Агент в программе</text>
<text x="1170" y="42" text-anchor="end" font-family="var(--font-body)" font-size="18" fill="var(--muted)">помощник монтажёра</text>

<rect x="30" y="64" width="320" height="116" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="2"/>
<circle cx="68" cy="122" r="19" fill="none" stroke="var(--accent)" stroke-width="2"/>
<text x="68" y="129" text-anchor="middle" font-family="var(--font-display)" font-weight="600" font-size="19" fill="var(--accent)">1</text>
<text x="100" y="112" font-family="var(--font-display)" font-weight="600" font-size="22" fill="var(--fg)">Задача словами</text>
<text x="100" y="140" font-family="var(--font-body)" font-size="18" fill="var(--muted)">в Premiere</text>
<text x="100" y="163" font-family="var(--font-body)" font-size="18" fill="var(--muted)">или Photoshop</text>

<rect x="440" y="64" width="320" height="116" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="2"/>
<circle cx="478" cy="122" r="19" fill="none" stroke="var(--accent)" stroke-width="2"/>
<text x="478" y="129" text-anchor="middle" font-family="var(--font-display)" font-weight="600" font-size="19" fill="var(--accent)">2</text>
<text x="510" y="112" font-family="var(--font-display)" font-weight="600" font-size="22" fill="var(--fg)">Агент правит</text>
<text x="510" y="140" font-family="var(--font-body)" font-size="18" fill="var(--muted)">проект по задаче,</text>
<text x="510" y="163" font-family="var(--font-body)" font-size="18" fill="var(--muted)">правки внутри</text>

<rect x="850" y="64" width="320" height="116" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="2"/>
<circle cx="888" cy="122" r="19" fill="none" stroke="var(--accent)" stroke-width="2"/>
<text x="888" y="129" text-anchor="middle" font-family="var(--font-display)" font-weight="600" font-size="19" fill="var(--accent)">3</text>
<text x="920" y="112" font-family="var(--font-display)" font-weight="600" font-size="22" fill="var(--fg)">Человек проверяет</text>
<text x="920" y="140" font-family="var(--font-body)" font-size="18" fill="var(--muted)">и сам выгружает</text>
<text x="920" y="163" font-family="var(--font-body)" font-size="18" fill="var(--muted)">готовое</text>

<line x1="358" y1="122" x2="432" y2="122" stroke="var(--line)" stroke-width="3" marker-end="url(#arL)"/>
<line x1="768" y1="122" x2="842" y2="122" stroke="var(--line)" stroke-width="3" marker-end="url(#arL)"/>

<line x1="30" y1="222" x2="1170" y2="222" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="6 8"/>

<text x="30" y="270" font-family="var(--font-display)" font-weight="600" font-size="26" fill="var(--fg)">Конвейер</text>
<text x="1170" y="270" text-anchor="end" font-family="var(--font-body)" font-size="18" fill="var(--muted)">монтаж без человека</text>

<rect x="30" y="292" width="320" height="116" rx="10" fill="var(--surface)" stroke="var(--accent)" stroke-width="2"/>
<circle cx="68" cy="350" r="19" fill="none" stroke="var(--accent)" stroke-width="2"/>
<text x="68" y="357" text-anchor="middle" font-family="var(--font-display)" font-weight="600" font-size="19" fill="var(--accent)">1</text>
<text x="100" y="340" font-family="var(--font-display)" font-weight="600" font-size="22" fill="var(--fg)">Дубль в Telegram</text>
<text x="100" y="368" font-family="var(--font-body)" font-size="18" fill="var(--muted)">снял на телефон</text>
<text x="100" y="391" font-family="var(--font-body)" font-size="18" fill="var(--muted)">и отправил боту</text>

<rect x="440" y="292" width="320" height="116" rx="10" fill="var(--surface)" stroke="var(--accent)" stroke-width="2"/>
<circle cx="478" cy="350" r="19" fill="none" stroke="var(--accent)" stroke-width="2"/>
<text x="478" y="357" text-anchor="middle" font-family="var(--font-display)" font-weight="600" font-size="19" fill="var(--accent)">2</text>
<text x="510" y="340" font-family="var(--font-display)" font-weight="600" font-size="22" fill="var(--fg)">Автомонтаж</text>
<text x="510" y="368" font-family="var(--font-body)" font-size="18" fill="var(--muted)">на компьютере,</text>
<text x="510" y="391" font-family="var(--font-body)" font-size="18" fill="var(--muted)">без присмотра</text>

<rect x="850" y="292" width="320" height="116" rx="10" fill="var(--surface)" stroke="var(--accent)" stroke-width="2"/>
<circle cx="888" cy="350" r="19" fill="none" stroke="var(--accent)" stroke-width="2"/>
<text x="888" y="357" text-anchor="middle" font-family="var(--font-display)" font-weight="600" font-size="19" fill="var(--accent)">3</text>
<text x="920" y="340" font-family="var(--font-display)" font-weight="600" font-size="22" fill="var(--fg)">Готовый ролик</text>
<text x="920" y="368" font-family="var(--font-body)" font-size="18" fill="var(--muted)">приходит в чат,</text>
<text x="920" y="391" font-family="var(--font-body)" font-size="18" fill="var(--muted)">выходит по слоту</text>

<line x1="358" y1="350" x2="432" y2="350" stroke="var(--accent)" stroke-width="3" marker-end="url(#arA)"/>
<line x1="768" y1="350" x2="842" y2="350" stroke="var(--accent)" stroke-width="3" marker-end="url(#arA)"/>
</svg>