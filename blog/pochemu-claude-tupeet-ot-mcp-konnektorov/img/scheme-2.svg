<svg width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-label="Схема переключения инструментов в чате: из строки ввода открывается меню коннекторов. Если включить один-два нужных сервера, ответ быстрый и контекст чистый. Если включить все серверы подряд, промпт перегружен и модель ошибается.">
  <title>Какие коннекторы включать в чате</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--line)"/>
    </marker>
    <marker id="arrAccent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/>
    </marker>
  </defs>

  <rect x="60" y="50" width="400" height="110" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="2"/>
  <text x="260" y="95" text-anchor="middle" font-family="var(--font-display)" font-weight="600" font-size="24" fill="var(--fg)">Строка ввода</text>
  <text x="260" y="128" text-anchor="middle" font-family="var(--font-body)" font-size="18" fill="var(--muted)">значок «+» под полем чата</text>

  <line x1="460" y1="105" x2="590" y2="105" stroke="var(--line)" stroke-width="3" marker-end="url(#arr)"/>

  <rect x="600" y="50" width="540" height="110" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="2"/>
  <text x="870" y="95" text-anchor="middle" font-family="var(--font-display)" font-weight="600" font-size="24" fill="var(--fg)">Меню коннекторов</text>
  <text x="870" y="128" text-anchor="middle" font-family="var(--font-body)" font-size="18" fill="var(--muted)">список подключённых серверов</text>

  <path d="M870 160 L870 205 L330 205 L330 250" fill="none" stroke="var(--accent)" stroke-width="4" marker-end="url(#arrAccent)"/>
  <path d="M870 160 L870 205 L870 250" fill="none" stroke="var(--line)" stroke-width="3" marker-end="url(#arr)"/>

  <text x="60" y="235" font-family="var(--font-body)" font-size="19" font-weight="600" fill="var(--accent)">Правильно</text>
  <text x="900" y="235" font-family="var(--font-body)" font-size="19" fill="var(--muted)">Ошибка</text>

  <rect x="60" y="260" width="540" height="110" rx="10" fill="var(--surface)" stroke="var(--accent)" stroke-width="3"/>
  <circle cx="105" cy="315" r="22" fill="none" stroke="var(--accent)" stroke-width="3"/>
  <text x="105" y="323" text-anchor="middle" font-family="var(--font-display)" font-weight="600" font-size="22" fill="var(--accent)">1</text>
  <text x="145" y="308" font-family="var(--font-display)" font-weight="600" font-size="24" fill="var(--fg)">Включены 1–2</text>
  <text x="145" y="342" font-family="var(--font-display)" font-weight="600" font-size="24" fill="var(--fg)">нужных сервера</text>

  <rect x="630" y="260" width="510" height="110" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="2"/>
  <circle cx="675" cy="315" r="22" fill="none" stroke="var(--line)" stroke-width="3"/>
  <text x="675" y="323" text-anchor="middle" font-family="var(--font-display)" font-weight="600" font-size="22" fill="var(--muted)">2</text>
  <text x="715" y="308" font-family="var(--font-display)" font-weight="600" font-size="24" fill="var(--fg)">Включены все</text>
  <text x="715" y="342" font-family="var(--font-display)" font-weight="600" font-size="24" fill="var(--fg)">серверы подряд</text>

  <line x1="330" y1="370" x2="330" y2="440" stroke="var(--accent)" stroke-width="4" marker-end="url(#arrAccent)"/>
  <line x1="885" y1="370" x2="885" y2="440" stroke="var(--line)" stroke-width="3" marker-end="url(#arr)"/>

  <rect x="60" y="450" width="540" height="110" rx="10" fill="var(--surface)" stroke="var(--accent)" stroke-width="3"/>
  <text x="330" y="495" text-anchor="middle" font-family="var(--font-display)" font-weight="600" font-size="24" fill="var(--fg)">Быстрый ответ</text>
  <text x="330" y="528" text-anchor="middle" font-family="var(--font-body)" font-size="18" fill="var(--muted)">и чистый контекст</text>

  <rect x="630" y="450" width="510" height="110" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="2"/>
  <text x="885" y="495" text-anchor="middle" font-family="var(--font-display)" font-weight="600" font-size="24" fill="var(--fg)">Перегруз промпта</text>
  <text x="885" y="528" text-anchor="middle" font-family="var(--font-body)" font-size="18" fill="var(--muted)">и ошибки модели</text>
</svg>